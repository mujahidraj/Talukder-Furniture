    <title>Talukder Furniture</title>
    <style>
      /* ═══ SPLASH — Dark Luxury Theme ═══ */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        overflow: hidden;
        transition: opacity 1s cubic-bezier(0.7, 0, 0.3, 1), visibility 1s;
      }

      #app-splash.hide {
        opacity: 0;
        visibility: hidden;
      }

      /* Animated aurora gradient background */
      .splash-aurora {
        position: absolute;
        inset: -50%;
        background: conic-gradient(
          from 180deg at 50% 50%,
          #0a0a0f 0deg,
          #1a1028 60deg,
          #0f1a2e 120deg,
          #0a0a0f 180deg,
          #1e0f1a 240deg,
          #0d1f2d 300deg,
          #0a0a0f 360deg
        );
        animation: auroraRotate 20s linear infinite;
        opacity: 0.7;
      }

      @keyframes auroraRotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Soft radial glow behind logo */
      .splash-glow {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(189, 154, 91, 0.15) 0%, transparent 70%);
        animation: pulseGlow 4s ease-in-out infinite;
        z-index: 1;
      }

      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50%      { transform: scale(1.15); opacity: 1; }
      }

      /* Canvas for floating particles */
      #splash-particles {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      /* Orbital ring 1 */
      .splash-orbit {
        position: absolute;
        width: 380px;
        height: 380px;
        border: 1px solid rgba(189, 154, 91, 0.08);
        border-radius: 50%;
        z-index: 2;
        animation: orbitSpin 25s linear infinite;
      }
      .splash-orbit::after {
        content: "";
        position: absolute;
        top: -3px;
        left: 50%;
        width: 6px;
        height: 6px;
        background: rgba(189, 154, 91, 0.6);
        border-radius: 50%;
        box-shadow: 0 0 12px 3px rgba(189, 154, 91, 0.4);
      }

      /* Orbital ring 2 — counter-rotating */
      .splash-orbit-2 {
        position: absolute;
        width: 440px;
        height: 440px;
        border: 1px solid rgba(189, 154, 91, 0.04);
        border-radius: 50%;
        z-index: 2;
        animation: orbitSpin 35s linear infinite reverse;
      }
      .splash-orbit-2::after {
        content: "";
        position: absolute;
        bottom: -2px;
        right: 30%;
        width: 4px;
        height: 4px;
        background: rgba(189, 154, 91, 0.4);
        border-radius: 50%;
        box-shadow: 0 0 8px 2px rgba(189, 154, 91, 0.3);
      }

      @keyframes orbitSpin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Logo styling */
      .splash-logo-wrapper {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app-splash .splash-logo-wrapper img {
        width: 280px;
        height: auto;
        max-height: 280px;
        object-fit: contain;
        opacity: 0;
        animation: logoReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        filter: drop-shadow(0 0 40px rgba(189, 154, 91, 0.2)) brightness(1.1);
      }

      @keyframes logoReveal {
        0%   { opacity: 0; transform: scale(0.85) translateY(30px); filter: blur(15px) brightness(1.1); }
        60%  { opacity: 1; filter: blur(0) brightness(1.1); }
        100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0) drop-shadow(0 0 40px rgba(189,154,91,0.2)) brightness(1.1); }
      }

      /* Content area below logo */
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 40px;
        z-index: 5;
      }

      /* Decorative divider line */
      .splash-divider {
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(189, 154, 91, 0.5), transparent);
        margin-bottom: 24px;
        animation: expandLine 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
      }

      @keyframes expandLine {
        to { width: 120px; }
      }

      /* Tagline text */
      .splash-text {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-size: 18px;
        color: rgba(189, 154, 91, 0.9);
        letter-spacing: 0.35em;
        margin-bottom: 36px;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }

      @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
      }

      /* Progress bar area */
      .splash-bar-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
      }

      .splash-bar-track {
        width: 200px;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
      }

      .splash-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #bd9a5b, #e8d5a3, #bd9a5b);
        background-size: 200% 100%;
        animation: splashFill 3s cubic-bezier(0.7, 0, 0.3, 1) 0.5s forwards, shimmer 2s linear infinite;
        box-shadow: 0 0 12px rgba(189, 154, 91, 0.4);
      }

      @keyframes splashFill {
        0%   { width: 0%; }
        15%  { width: 15%; }
        40%  { width: 45%; }
        70%  { width: 78%; }
        90%  { width: 92%; }
        100% { width: 100%; }
      }

      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .splash-pct {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.3em;
      }

      /* Corner decorative accents */
      .splash-corner {
        position: absolute;
        width: 60px;
        height: 60px;
        z-index: 3;
        opacity: 0;
        animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      }
      .splash-corner--tl { top: 30px; left: 30px; border-top: 1px solid rgba(189,154,91,0.2); border-left: 1px solid rgba(189,154,91,0.2); }
      .splash-corner--tr { top: 30px; right: 30px; border-top: 1px solid rgba(189,154,91,0.2); border-right: 1px solid rgba(189,154,91,0.2); }
      .splash-corner--bl { bottom: 30px; left: 30px; border-bottom: 1px solid rgba(189,154,91,0.2); border-left: 1px solid rgba(189,154,91,0.2); }
      .splash-corner--br { bottom: 30px; right: 30px; border-bottom: 1px solid rgba(189,154,91,0.2); border-right: 1px solid rgba(189,154,91,0.2); }
    </style>
  </head>
  <body>
    <!-- Initial splash screen — visible before React loads -->
    <div id="app-splash">
      <!-- Animated background layers -->
      <div class="splash-aurora"></div>
      <div class="splash-glow"></div>
      <canvas id="splash-particles"></canvas>

      <!-- Orbital rings -->
      <div class="splash-orbit"></div>
      <div class="splash-orbit-2"></div>

      <!-- Corner accents -->
      <div class="splash-corner splash-corner--tl"></div>
      <div class="splash-corner splash-corner--tr"></div>
      <div class="splash-corner splash-corner--bl"></div>
      <div class="splash-corner splash-corner--br"></div>

      <!-- Logo -->
      <div class="splash-logo-wrapper">
        <img src="/LOGO.gif" alt="Talukder Furniture" />
      </div>

      <!-- Content below logo -->
      <div class="splash-content">
        <div class="splash-divider"></div>
        <span class="splash-text">Qualityful Life</span>
        <div class="splash-bar-wrapper">
          <div class="splash-bar-track">
            <div class="splash-bar-fill"></div>
          </div>
          <span class="splash-pct" id="splash-pct">0%</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        /* ── Golden Particle System ── */
        var canvas = document.getElementById('splash-particles');
        if (canvas) {
          var ctx = canvas.getContext('2d');
          var particles = [];
          var particleCount = 50;

          function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          }
          resizeCanvas();
          window.addEventListener('resize', resizeCanvas);

          function Particle() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.5 + 0.1;
            this.fadeDir = Math.random() > 0.5 ? 1 : -1;
          }

          Particle.prototype.update = function() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.opacity += this.fadeDir * 0.003;
            if (this.opacity >= 0.6 || this.opacity <= 0.05) this.fadeDir *= -1;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
          };

          Particle.prototype.draw = function() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(189, 154, 91, ' + this.opacity + ')';
            ctx.fill();
            // Tiny glow
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(189, 154, 91, ' + (this.opacity * 0.5) + ')';
          };

          for (var i = 0; i < particleCount; i++) {
            particles.push(new Particle());
          }

          function animateParticles() {
            if (!document.getElementById('splash-particles')) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            for (var j = 0; j < particles.length; j++) {
              particles[j].update();
              particles[j].draw();
            }
            requestAnimationFrame(animateParticles);
          }
          animateParticles();
        }

        /* ── Percentage Counter ── */
        var duration = 3000;
        var start = Date.now();
        var el = document.getElementById('splash-pct');
        function tick() {
          var elapsed = Date.now() - start;
          var pct = Math.min(100, Math.round((elapsed / duration) * 100));
          if (el) el.textContent = pct + '%';
          if (pct < 100) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
